<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>PQ vendor verification</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
// Behavioural verification of the vendored @noble/post-quantum tree.
// We do not trust the library because it is popular; we trust it because every
// length below is measured from a key this browser just generated, and checked
// against the byte counts fixed by FIPS 203 / 204 / 205.
import { ml_kem512, ml_kem768, ml_kem1024 } from './ml-kem.mjs';
import { ml_dsa44, ml_dsa65, ml_dsa87 } from './ml-dsa.mjs';
import { slh_dsa_sha2_128s } from './slh-dsa.mjs';

const R = [];
const ok = (name, got, want) => R.push({ name, got, want, pass: got === want });

// ---- FIPS 203 (ML-KEM): encapsulation key / ciphertext / shared secret ----
for (const [label, kem, pk, ct] of [
  ['ML-KEM-512', ml_kem512, 800, 768],
  ['ML-KEM-768', ml_kem768, 1184, 1088],
  ['ML-KEM-1024', ml_kem1024, 1568, 1568],
]) {
  const k = kem.keygen();
  const { cipherText, sharedSecret } = kem.encapsulate(k.publicKey);
  ok(`${label} encapsulation key`, k.publicKey.length, pk);
  ok(`${label} ciphertext`, cipherText.length, ct);
  ok(`${label} shared secret`, sharedSecret.length, 32);
  // round trip: the receiver must recover the identical secret
  const back = kem.decapsulate(cipherText, k.secretKey);
  ok(`${label} encaps/decaps agree`,
     back.length === sharedSecret.length && back.every((b, i) => b === sharedSecret[i]), true);
}

// ---- FIPS 204 (ML-DSA): public key / signature ----
const msg = new TextEncoder().encode('SymbiQ size cliff');
for (const [label, dsa, pk, sig] of [
  ['ML-DSA-44', ml_dsa44, 1312, 2420],
  ['ML-DSA-65', ml_dsa65, 1952, 3309],
  ['ML-DSA-87', ml_dsa87, 2592, 4627],
]) {
  const k = dsa.keygen();
  const s = dsa.sign(msg, k.secretKey);
  ok(`${label} public key`, k.publicKey.length, pk);
  ok(`${label} signature`, s.length, sig);
  ok(`${label} verifies`, dsa.verify(s, msg, k.publicKey), true);
  const bad = Uint8Array.from(s); bad[0] ^= 1;          // flip one bit
  ok(`${label} rejects tampered`, dsa.verify(bad, msg, k.publicKey), false);
}

// ---- FIPS 205 (SLH-DSA): the inverse trade — tiny key, enormous signature ----
{
  const k = slh_dsa_sha2_128s.keygen();
  const s = slh_dsa_sha2_128s.sign(msg, k.secretKey);
  ok('SLH-DSA-SHA2-128s public key', k.publicKey.length, 32);
  ok('SLH-DSA-SHA2-128s signature', s.length, 7856);
  ok('SLH-DSA-SHA2-128s verifies', slh_dsa_sha2_128s.verify(s, msg, k.publicKey), true);
}

// ---- X25519 from native WebCrypto (no vendored curve code) ----
let x25519 = 'unsupported';
try {
  const kp = await crypto.subtle.generateKey({ name: 'X25519' }, true, ['deriveBits']);
  const raw = await crypto.subtle.exportKey('raw', kp.publicKey);
  x25519 = raw.byteLength;
} catch (e) { x25519 = 'unsupported: ' + e.name; }
R.push({ name: 'X25519 public key (WebCrypto)', got: x25519, want: 32, pass: x25519 === 32 });

const fails = R.filter(r => !r.pass);
document.getElementById('out').textContent =
  R.map(r => `${r.pass ? 'PASS' : 'FAIL'}  ${r.name.padEnd(34)} got=${r.got}  want=${r.want}`).join('\n') +
  `\n\n${R.length - fails.length}/${R.length} passed`;
window.__PQ = { results: R, fails: fails.length, total: R.length };
</script>
</body>
</html>
